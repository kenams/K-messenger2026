plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.kahdigital.kssenger'
version = '1.0.0'

android {
  namespace "com.kahdigital.kssenger.signal"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }
}

repositories {
  maven { url 'https://build-artifacts.signal.org/libraries/maven/' }
  mavenCentral()
}

dependencies {
  implementation "org.signal:libsignal-client:0.100.0"
  implementation "org.signal:libsignal-android:0.100.0"

  androidTestImplementation "androidx.test:core:1.6.1"
  androidTestImplementation "androidx.test.ext:junit:1.2.1"
  androidTestImplementation "androidx.test:runner:1.6.2"
}
