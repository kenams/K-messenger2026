name: Android Internal APK

on:
  workflow_dispatch:
  push:
    branches:
      - bootstrap/platform
      - fix/feed-kmap-contact-security
    paths:
      - 'apps/mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-debug-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      NODE_ENV: production
      EXPO_PUBLIC_NEON_AUTH_URL: https://ep-long-smoke-b1c368ej.neonauth.c-5.eu-central-1.aws.neon.tech/kssenger/auth
      EXPO_PUBLIC_NEON_DATA_API_URL: https://ep-long-smoke-b1c368ej.apirest.c-5.eu-central-1.aws.neon.tech/kssenger/rest/v1
      EXPO_PUBLIC_KSSENGER_SOCKET_URL: https://kssenger-server.onrender.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Validate K-ssenger public backend configuration
        run: |
          test "$EXPO_PUBLIC_NEON_AUTH_URL" = "https://ep-long-smoke-b1c368ej.neonauth.c-5.eu-central-1.aws.neon.tech/kssenger/auth"
          test "$EXPO_PUBLIC_NEON_DATA_API_URL" = "https://ep-long-smoke-b1c368ej.apirest.c-5.eu-central-1.aws.neon.tech/kssenger/rest/v1"
          test "$EXPO_PUBLIC_KSSENGER_SOCKET_URL" = "https://kssenger-server.onrender.com"

      - name: Expo prebuild Android
        working-directory: apps/mobile
        run: npx expo prebuild --platform android

      - name: Build standalone internal release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: k-ssenger-android-internal-release
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
