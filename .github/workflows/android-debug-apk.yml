name: Android V2 Internal APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/device-linking-scaffold
      - work/openai-android-v2-build-20260912
    paths:
      - 'apps/mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/release-candidate-static-gate.mjs'
      - '.github/workflows/android-debug-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      NODE_ENV: production
      EXPO_PUBLIC_NEON_AUTH_URL: https://ep-long-smoke-b1c368ej.neonauth.c-5.eu-central-1.aws.neon.tech/kssenger/auth
      EXPO_PUBLIC_NEON_DATA_API_URL: https://ep-long-smoke-b1c368ej.apirest.c-5.eu-central-1.aws.neon.tech/kssenger/rest/v1
      EXPO_PUBLIC_KSSENGER_SOCKET_URL: https://kssenger-server.onrender.com
      EXPO_PUBLIC_SPOTIFY_CLIENT_ID: acdb17c786eb432aa1ceacbd49a2de88
      EXPO_PUBLIC_LASTFM_CLIENT_ID: 6cf2de22fd7a199162deaeab4b3bcb2d
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Gate V2 release configuration
        run: npm run release:check-static

      - name: Typecheck mobile
        run: npm --workspace @kssenger/mobile run typecheck

      - name: Expo prebuild Android
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean

      - name: Verify generated Android release hardening
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          MANIFEST=android/app/src/main/AndroidManifest.xml
          test -f "$MANIFEST"
          grep -E 'android:allowBackup="false"' "$MANIFEST"
          grep -E 'android:usesCleartextTraffic="false"' "$MANIFEST"
          ! grep -F 'android.permission.ACCESS_BACKGROUND_LOCATION' "$MANIFEST"

      - name: Enforce removed libsignal runtime stays removed
        run: |
          set -euo pipefail
          test ! -d apps/mobile/modules/kssenger-signal
          test ! -f apps/mobile/plugins/withKssengerLibsignal.js
          ! grep -R -F 'org.signal:libsignal' apps/mobile/android --include='*.gradle' --include='*.kts'
          grep -F "PLAINTEXT_ALGO = 'kssenger-plaintext-v1'" apps/mobile/src/lib/chatTransport.ts

      - name: Build standalone internal release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify final APK exists
        working-directory: apps/mobile/android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null

      - name: Generate APK SHA-256 manifest
        working-directory: apps/mobile/android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          CHECKSUM=app/build/outputs/apk/release/app-release.apk.sha256
          sha256sum "$APK" > "$CHECKSUM"
          sha256sum --check "$CHECKSUM"

      - name: Upload standalone APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: K-ssenger-V2-BETA-01
          path: |
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 14
