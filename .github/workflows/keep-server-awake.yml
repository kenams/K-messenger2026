name: Keep server awake

# Render's free tier sleeps the kssenger-server web service after ~15 min of
# no HTTP traffic; the next request then eats a 20-30s cold-start penalty —
# invisible to Kenams (who wakes it before testing) but a first-message dead
# end for a real visitor. bot-interactions.yml/kah-life-interactions.yml
# already hit the server but only every 30min/2h, both wider than the sleep
# window. A plain /health ping every 10 min is enough to keep it warm and
# costs nothing (no DB writes, <100ms response).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /health
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://kssenger-server.onrender.com/health)
          echo "status=$status"
          if [ "$status" != "200" ]; then
            echo "::warning::kssenger-server /health returned $status"
          fi
