name: Android APK

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/android-apk.yml
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Android release source
        uses: actions/checkout@v4
        with:
          ref: release/android-test

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Generate Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Build standalone release APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p dist
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk dist/K-ssenger-android-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: K-ssenger-android-release
          path: dist/K-ssenger-android-release.apk
          if-no-files-found: error
          retention-days: 14
