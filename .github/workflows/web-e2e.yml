name: Web E2E (journeys)

on:
  workflow_dispatch:
  push:
    branches: [main, feature/device-linking-scaffold]
    paths:
      - 'apps/mobile/**'
      - 'apps/e2e/**'
      - '.github/workflows/web-e2e.yml'
  schedule:
    - cron: '0 6 * * *' # daily prod health check

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Wake the realtime service
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 15 https://kssenger-server.onrender.com/health | grep -q '"ok":true'; then
              echo "realtime OK"; exit 0
            fi
            sleep 5
          done
          echo "realtime health failed"; exit 1
      - name: Install Playwright Chromium
        run: npm --workspace @kssenger/e2e run install-browser
      - name: Run journey suite against production
        env:
          E2E_BASE_URL: https://k-ssenger.expo.app
        run: npm --workspace @kssenger/e2e test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 7
