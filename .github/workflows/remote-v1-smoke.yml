name: Remote V1 Smoke

on:
  workflow_dispatch:
  push:
    branches: [fix/feed-kmap-contact-security]
    paths:
      - 'apps/server/**'
      - 'neon/migrations/**'
      - 'scripts/remote-v1-smoke*.mjs'
      - 'scripts/neon-auth-self-delete-smoke.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/remote-v1-smoke.yml'

jobs:
  remote-v1-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Wake and verify public realtime service
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 15 https://kssenger-server.onrender.com/health | grep -q '"ok":true'; then
              echo "K-ssenger realtime health OK"
              exit 0
            fi
            sleep 5
          done
          echo "K-ssenger realtime health failed"
          exit 1
      - name: Run real Neon + Socket.IO Alice/Bob/Charlie smoke
        env:
          KSSENGER_AUTH_URL: https://ep-long-smoke-b1c368ej.neonauth.c-5.eu-central-1.aws.neon.tech/kssenger/auth
          KSSENGER_DATA_API_URL: https://ep-long-smoke-b1c368ej.apirest.c-5.eu-central-1.aws.neon.tech/kssenger/rest/v1
          KSSENGER_SOCKET_URL: https://kssenger-server.onrender.com
        run: node scripts/remote-v1-smoke-runner.mjs
      - name: Prove password-authenticated Neon self-delete
        env:
          KSSENGER_AUTH_URL: https://ep-long-smoke-b1c368ej.neonauth.c-5.eu-central-1.aws.neon.tech/kssenger/auth
          KSSENGER_DATA_API_URL: https://ep-long-smoke-b1c368ej.apirest.c-5.eu-central-1.aws.neon.tech/kssenger/rest/v1
        run: node scripts/neon-auth-self-delete-smoke.mjs
