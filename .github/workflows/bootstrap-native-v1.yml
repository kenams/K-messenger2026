name: Bootstrap Native V1 Dependencies

on:
  push:
    branches: [fix/feed-kmap-contact-security]
    paths:
      - '.github/workflows/bootstrap-native-v1.yml'

permissions:
  contents: write

jobs:
  install-native-modules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/feed-kmap-contact-security
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Expo-compatible native V1 modules
        working-directory: apps/mobile
        run: npx expo install expo-notifications expo-device expo-constants expo-location expo-image-picker expo-video --npm
      - name: Commit deterministic dependency update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Native dependencies already pinned"
            exit 0
          fi
          git commit -m "build(mobile): pin Expo native V1 modules"
          git push origin HEAD:fix/feed-kmap-contact-security
