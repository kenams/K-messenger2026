name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run test:server

  rls-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kssenger_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kssenger_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run Alice/Bob/Charlie Neon RLS integration suite
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:55432/kssenger_test
          KSSENGER_RLS_RESET: "1"
        run: node scripts/neon-rls-integration-test.mjs
